<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <title>Memory structure</title>
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2678c"/>
    </marker>
    <marker id="me" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7fa6"/>
    </marker>
    <marker id="my" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b0713a"/>
    </marker>
  </defs>

  <!-- Background (painted for dark-mode safety) -->
  <rect x="0.5" y="0.5" width="1239" height="667" fill="#ffffff" stroke="#e8e2de"/>

  <!-- Title -->
  <g stroke="#7a6f68" stroke-width="2" fill="none">
    <ellipse cx="313" cy="19" rx="8" ry="3.2"/>
    <path d="M305 19 v11 a8 3.2 0 0 0 16 0 v-11"/>
    <path d="M305 24.5 a8 3.2 0 0 0 16 0"/>
  </g>
  <text x="330" y="32" font-size="13.5" fill="#7a6f68" font-weight="bold">Character memory structure ── fully separated per character in character_data/, all stored locally</text>

  <!-- Column headers -->
  <text x="165" y="88" font-size="14" fill="#3f3833" text-anchor="middle" font-weight="bold">How memories get in (activity → memory)</text>
  <text x="1075" y="88" font-size="14" fill="#3f3833" text-anchor="middle" font-weight="bold">How memories are used (memory → activity)</text>

  <!-- ============ Pyramid ============ -->
  <!-- L1 short-term -->
  <path d="M500 110 L740 110 L772 246 L468 246 Z" fill="#faf6f2" stroke="#b9aca4" stroke-width="2"/>
  <text x="620" y="132" font-size="13.5" fill="#3f3833" text-anchor="middle" font-weight="bold">Short-term memory (recent activity)</text>
  <rect x="498" y="142" width="244" height="38" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="157" font-size="11" fill="#5a5049" text-anchor="middle">Conversation history ─ memory/&lt;id&gt;.db</text>
  <text x="620" y="173" font-size="10.5" fill="#8a817c" text-anchor="middle">(SQLite; all messages + embeddings, cap 5000)</text>
  <rect x="510" y="186" width="220" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="201" font-size="11" fill="#5a5049" text-anchor="middle">ELYTH session logs ─ last 5</text>
  <rect x="510" y="214" width="220" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="229" font-size="11" fill="#5a5049" text-anchor="middle">YouTube reply history ─ last 1000</text>

  <!-- L2 mid-term (notes & relationships) -->
  <path d="M468 250 L772 250 L810 408 L430 408 Z" fill="#f8f1ea" stroke="#b9aca4" stroke-width="2"/>
  <text x="620" y="272" font-size="13.5" fill="#3f3833" text-anchor="middle" font-weight="bold">Mid-term memory (notes &amp; relationships)</text>
  <rect x="500" y="282" width="240" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="297" font-size="11" fill="#5a5049" text-anchor="middle">Notes ─ notes/&lt;id&gt;.md, max 3000 chars</text>
  <rect x="500" y="310" width="240" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="325" font-size="11" fill="#5a5049" text-anchor="middle">ELYTH Notes ─ max 3000 chars</text>
  <rect x="450" y="338" width="340" height="38" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="353" font-size="11" fill="#5a5049" text-anchor="middle">Relationship with you ─ relationship/&lt;id&gt;.txt (max 1000)</text>
  <text x="620" y="369" font-size="10.5" fill="#8a817c" text-anchor="middle">(her impressions, feelings and stance toward you)</text>
  <rect x="505" y="382" width="230" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="397" font-size="11" fill="#5a5049" text-anchor="middle">ELYTH relationships ─ one per contact</text>

  <!-- L3 long-term -->
  <path d="M429 412 L811 412 L846 560 L394 560 Z" fill="#fbeef3" stroke="#d98cab" stroke-width="2"/>
  <text x="620" y="438" font-size="13.5" fill="#8c3a5c" text-anchor="middle" font-weight="bold">Long-term memory (facts, preferences, experiences)</text>
  <text x="620" y="462" font-size="11" fill="#5a5049" text-anchor="middle">extracted by the LLM from conversations and activities, capped at 500</text>
  <text x="620" y="482" font-size="11" fill="#5a5049" text-anchor="middle">recalled via embedding similarity search</text>
  <text x="620" y="506" font-size="10" fill="#8c6478" text-anchor="middle">7 categories: user_fact / user_preference /</text>
  <text x="620" y="522" font-size="10" fill="#8c6478" text-anchor="middle">character_relationship / shared_experience /</text>
  <text x="620" y="538" font-size="10" fill="#8c6478" text-anchor="middle">user_opinion / elyth / youtube</text>

  <!-- ============ Left: write arrows (route rows → item boxes) ============ -->
  <g fill="none" stroke-width="1.7" opacity="0.9">
    <path d="M310,174 C370,174 436,161 498,161" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M310,198 C370,198 440,293 500,293" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M310,222 C370,222 390,357 450,357" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M310,246 C370,246 351,490 411,490" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M310,364 C370,364 450,197 510,197" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M310,388 C370,388 440,321 500,321" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M310,412 C370,412 445,393 505,393" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M310,436 C370,436 347,505 407,505" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M310,556 C370,556 450,225 510,225" stroke="#b0713a" marker-end="url(#my)"/>
    <path d="M310,580 C370,580 339,540 399,540" stroke="#b0713a" marker-end="url(#my)"/>
  </g>

  <!-- ============ Right: read arrows (item boxes → route rows; dashed = default OFF) ============ -->
  <g fill="none" stroke-width="1.7" opacity="0.9">
    <path d="M742,161 C802,161 870,156 930,156" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M740,293 C810,293 870,180 930,180" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M740,321 C815,321 870,198 930,198" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M790,357 C845,357 870,222 930,222" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M829,490 C886,490 870,246 930,246" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M730,197 C810,197 870,340 930,340" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M740,321 C815,321 875,361 930,361" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M740,293 C815,293 875,370 930,370" stroke="#5b7fa6" stroke-dasharray="5 4" marker-end="url(#me)"/>
    <path d="M735,393 C805,393 870,385 930,385" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M790,357 C845,357 875,394 930,394" stroke="#5b7fa6" stroke-dasharray="5 4" marker-end="url(#me)"/>
    <path d="M839,530 C896,530 870,421 930,421" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M730,225 C810,225 870,524 930,524" stroke="#b0713a" marker-end="url(#my)"/>
  </g>
  <!-- Read-arrow anchors (right edge of the item boxes) -->
  <g fill="#7a6f68">
    <circle cx="742" cy="161" r="2.6"/>
    <circle cx="730" cy="197" r="2.6"/>
    <circle cx="730" cy="225" r="2.6"/>
    <circle cx="740" cy="293" r="2.6"/>
    <circle cx="740" cy="321" r="2.6"/>
    <circle cx="790" cy="357" r="2.6"/>
    <circle cx="735" cy="393" r="2.6"/>
    <circle cx="829" cy="490" r="2.6"/>
    <circle cx="839" cy="530" r="2.6"/>
  </g>

  <!-- ============ Left: route boxes (writes) ============ -->
  <rect x="20" y="110" width="290" height="148" rx="8" fill="#fcf0f4" stroke="#c2678c" stroke-width="1.8"/>
  <text x="36" y="132" font-size="12.5" fill="#a34a6e" font-weight="bold">Regular conversation</text>
  <text x="36" y="150" font-size="10" fill="#9a8f88">your everyday conversations with the character</text>
  <text x="36" y="178" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Short-term</tspan> every message saved, each turn</text>
  <text x="36" y="202" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Mid-term</tspan> she edits Notes via tools (Notes ON)</text>
  <text x="36" y="226" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Mid-term</tspan> her view of you, updated at extraction</text>
  <text x="36" y="250" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Long-term</tspan> LLM extracts at 50 (Ollama) / 100 (API)</text>

  <rect x="20" y="300" width="290" height="148" rx="8" fill="#eff4f9" stroke="#5b7fa6" stroke-width="1.8"/>
  <text x="36" y="322" font-size="12.5" fill="#456e88" font-weight="bold">ELYTH sessions</text>
  <text x="36" y="340" font-size="10" fill="#9a8f88">her autonomous social life among AI characters</text>
  <text x="36" y="368" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Short-term</tspan> saves each session's activity log</text>
  <text x="36" y="392" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Mid-term</tspan> she edits ELYTH Notes via tools</text>
  <text x="36" y="416" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Mid-term</tspan> per-contact impressions</text>
  <text x="36" y="440" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Long-term</tspan> extraction 1st + every 3rd run</text>

  <rect x="20" y="490" width="290" height="100" rx="8" fill="#f9f1e7" stroke="#b0713a" stroke-width="1.8"/>
  <text x="36" y="512" font-size="12.5" fill="#93601f" font-weight="bold">YouTube replies</text>
  <text x="36" y="530" font-size="10" fill="#9a8f88">auto-replies to comments on your channel</text>
  <text x="36" y="560" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Short-term</tspan> records each posted reply</text>
  <text x="36" y="584" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Long-term</tspan> LLM extracts past 50 replies</text>

  <!-- ============ Right: route boxes (reads) ============ -->
  <rect x="930" y="110" width="290" height="152" rx="8" fill="#fcf0f4" stroke="#c2678c" stroke-width="1.8"/>
  <text x="946" y="132" font-size="12.5" fill="#a34a6e" font-weight="bold">Regular conversation</text>
  <text x="946" y="160" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Short-term</tspan> last 20 messages, always injected</text>
  <text x="946" y="184" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Mid-term</tspan> Notes (when Notes is ON) /</text>
  <text x="978" y="202" font-size="10.5" fill="#5a5049">ELYTH Notes (when ELYTH POST is ON)</text>
  <text x="946" y="226" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Mid-term</tspan> relationship always injected</text>
  <text x="946" y="250" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Long-term</tspan> only memories similar to what you said</text>

  <rect x="930" y="294" width="290" height="152" rx="8" fill="#eff4f9" stroke="#5b7fa6" stroke-width="1.8"/>
  <text x="946" y="316" font-size="12.5" fill="#456e88" font-weight="bold">ELYTH sessions</text>
  <text x="946" y="344" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Short-term</tspan> replays her past session logs</text>
  <text x="946" y="368" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Mid-term</tspan> ELYTH Notes always; yours default OFF</text>
  <text x="946" y="392" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Mid-term</tspan> ELYTH relationships always; yours OFF</text>
  <text x="946" y="416" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Long-term</tspan> RAG — default: ELYTH/YouTube-derived only</text>
  <text x="978" y="434" font-size="10.5" fill="#5a5049">(switchable to all / off)</text>

  <rect x="930" y="478" width="290" height="96" rx="8" fill="#f9f1e7" stroke="#b0713a" stroke-width="1.8"/>
  <text x="946" y="500" font-size="12.5" fill="#93601f" font-weight="bold">YouTube replies</text>
  <text x="946" y="528" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">Short-term</tspan> last 5 from the same video &amp; person</text>
  <text x="946" y="552" font-size="10.5" fill="#8a817c"><tspan font-weight="bold">Long-term</tspan> never read (nothing leaks into public)</text>

  <!-- Legend / footnote -->
  <text x="1220" y="596" font-size="10" fill="#8a817c" text-anchor="end">dashed = optional reads (default OFF)</text>
  <text x="620" y="628" font-size="10.5" fill="#8a817c" text-anchor="middle">* Your own writes (adding / editing / pinning long-term memories on the History page) are omitted from this figure</text>
</svg>
