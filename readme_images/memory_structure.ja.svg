<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="'Hiragino Sans','Yu Gothic UI',Meiryo,system-ui,sans-serif">
  <title>記憶構造</title>
  <defs>
    <marker id="mk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2678c"/>
    </marker>
    <marker id="me" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7fa6"/>
    </marker>
    <marker id="my" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b0713a"/>
    </marker>
  </defs>

  <!-- 背景（塗り込み・ダークモード対策） -->
  <rect x="0.5" y="0.5" width="1239" height="667" fill="#ffffff" stroke="#e8e2de"/>

  <!-- タイトル -->
  <g stroke="#7a6f68" stroke-width="2" fill="none">
    <ellipse cx="353" cy="19" rx="8" ry="3.2"/>
    <path d="M345 19 v11 a8 3.2 0 0 0 16 0 v-11"/>
    <path d="M345 24.5 a8 3.2 0 0 0 16 0"/>
  </g>
  <text x="370" y="32" font-size="13.5" fill="#7a6f68" font-weight="bold">キャラクターの記憶構造 ── character_data/ にキャラクターごとに完全分離・すべてローカル保存</text>

  <!-- 列ヘッダ -->
  <text x="165" y="88" font-size="14" fill="#3f3833" text-anchor="middle" font-weight="bold">侵入経路（活動 → 記憶に書く）</text>
  <text x="1075" y="88" font-size="14" fill="#3f3833" text-anchor="middle" font-weight="bold">発揮経路（記憶 → 活動に載る）</text>

  <!-- ============ ピラミッド ============ -->
  <!-- L1 短期記憶 -->
  <path d="M500 110 L740 110 L772 246 L468 246 Z" fill="#faf6f2" stroke="#b9aca4" stroke-width="2"/>
  <text x="620" y="132" font-size="13.5" fill="#3f3833" text-anchor="middle" font-weight="bold">短期記憶（直近の活動履歴）</text>
  <rect x="497" y="142" width="246" height="38" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="157" font-size="11" fill="#5a5049" text-anchor="middle">会話履歴 ─ memory/&lt;id&gt;.db（SQLite）</text>
  <text x="620" y="173" font-size="10.5" fill="#8a817c" text-anchor="middle">（全発言＋埋め込み・保持上限5000件）</text>
  <rect x="510" y="186" width="220" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="201" font-size="11" fill="#5a5049" text-anchor="middle">ELYTHセッションログ ─ 直近5件</text>
  <rect x="510" y="214" width="220" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="229" font-size="11" fill="#5a5049" text-anchor="middle">YouTube返信履歴 ─ 直近1000件</text>

  <!-- L2 中期記憶（ノート・関係性） -->
  <path d="M468 250 L772 250 L810 408 L430 408 Z" fill="#f8f1ea" stroke="#b9aca4" stroke-width="2"/>
  <text x="620" y="272" font-size="13.5" fill="#3f3833" text-anchor="middle" font-weight="bold">中期記憶（ノート・関係性）</text>
  <rect x="500" y="282" width="240" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="297" font-size="11" fill="#5a5049" text-anchor="middle">ノート ─ notes/&lt;id&gt;.md・最大3000字</text>
  <rect x="500" y="310" width="240" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="325" font-size="11" fill="#5a5049" text-anchor="middle">ELYTHノート ─ 最大3000字</text>
  <rect x="450" y="338" width="340" height="38" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="353" font-size="11" fill="#5a5049" text-anchor="middle">あなたへの関係性 ─ relationship/&lt;id&gt;.txt・最大1000字</text>
  <text x="620" y="369" font-size="10.5" fill="#8a817c" text-anchor="middle">（印象・気持ち・接し方）</text>
  <rect x="510" y="382" width="220" height="22" rx="5" fill="#ffffff" stroke="#c9beb6" stroke-width="1.2"/>
  <text x="620" y="397" font-size="11" fill="#5a5049" text-anchor="middle">ELYTH関係性 ─ SNSの相手ごと</text>

  <!-- L3 長期記憶 -->
  <path d="M429 412 L811 412 L846 560 L394 560 Z" fill="#fbeef3" stroke="#d98cab" stroke-width="2"/>
  <text x="620" y="438" font-size="13.5" fill="#8c3a5c" text-anchor="middle" font-weight="bold">長期記憶（抽出された事実・好み・経験）</text>
  <text x="620" y="462" font-size="11" fill="#5a5049" text-anchor="middle">会話や活動からLLMが自動抽出・上限500件</text>
  <text x="620" y="482" font-size="11" fill="#5a5049" text-anchor="middle">埋め込みの類似検索で想起</text>
  <text x="620" y="506" font-size="10" fill="#8c6478" text-anchor="middle">カテゴリ7種: user_fact / user_preference /</text>
  <text x="620" y="522" font-size="10" fill="#8c6478" text-anchor="middle">character_relationship / shared_experience /</text>
  <text x="620" y="538" font-size="10" fill="#8c6478" text-anchor="middle">user_opinion / elyth / youtube</text>

  <!-- ============ 左: 書き込みの矢印（経路の行 → 項目の囲み） ============ -->
  <g fill="none" stroke-width="1.7" opacity="0.9">
    <path d="M310,174 C370,174 435,161 497,161" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M310,198 C370,198 440,293 500,293" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M310,222 C370,222 390,357 450,357" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M310,246 C370,246 351,490 411,490" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M310,364 C370,364 450,197 510,197" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M310,388 C370,388 440,321 500,321" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M310,412 C370,412 450,393 510,393" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M310,436 C370,436 347,505 407,505" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M310,556 C370,556 450,225 510,225" stroke="#b0713a" marker-end="url(#my)"/>
    <path d="M310,580 C370,580 339,540 399,540" stroke="#b0713a" marker-end="url(#my)"/>
  </g>

  <!-- ============ 右: 読み出しの矢印（項目の囲み → 経路の行・破線＝既定OFF） ============ -->
  <g fill="none" stroke-width="1.7" opacity="0.9">
    <path d="M743,161 C803,161 870,156 930,156" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M740,293 C810,293 870,180 930,180" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M740,321 C815,321 870,198 930,198" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M790,357 C845,357 870,222 930,222" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M829,490 C886,490 870,246 930,246" stroke="#c2678c" marker-end="url(#mk)"/>
    <path d="M730,197 C810,197 870,340 930,340" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M740,321 C815,321 875,361 930,361" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M740,293 C815,293 875,370 930,370" stroke="#5b7fa6" stroke-dasharray="5 4" marker-end="url(#me)"/>
    <path d="M730,393 C800,393 870,385 930,385" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M790,357 C845,357 875,394 930,394" stroke="#5b7fa6" stroke-dasharray="5 4" marker-end="url(#me)"/>
    <path d="M839,530 C896,530 870,421 930,421" stroke="#5b7fa6" marker-end="url(#me)"/>
    <path d="M730,225 C810,225 870,524 930,524" stroke="#b0713a" marker-end="url(#my)"/>
  </g>
  <!-- 読み出し矢印の起点アンカー（囲みの右縁） -->
  <g fill="#7a6f68">
    <circle cx="743" cy="161" r="2.6"/>
    <circle cx="730" cy="197" r="2.6"/>
    <circle cx="730" cy="225" r="2.6"/>
    <circle cx="740" cy="293" r="2.6"/>
    <circle cx="740" cy="321" r="2.6"/>
    <circle cx="790" cy="357" r="2.6"/>
    <circle cx="730" cy="393" r="2.6"/>
    <circle cx="829" cy="490" r="2.6"/>
    <circle cx="839" cy="530" r="2.6"/>
  </g>

  <!-- ============ 左: 経路ボックス（書き込み） ============ -->
  <rect x="20" y="110" width="290" height="148" rx="8" fill="#fcf0f4" stroke="#c2678c" stroke-width="1.8"/>
  <text x="36" y="132" font-size="12.5" fill="#a34a6e" font-weight="bold">通常の会話</text>
  <text x="36" y="150" font-size="10" fill="#9a8f88">あなたとキャラクターのふだんの会話</text>
  <text x="36" y="178" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">短期</tspan> 発言を毎ターン保存</text>
  <text x="36" y="202" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">中期</tspan> ノートを自律編集（ノート機能ON時）</text>
  <text x="36" y="226" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">中期</tspan> あなたへの印象を自動更新（抽出と同時）</text>
  <text x="36" y="250" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">長期</tspan> 未処理50件(Ollama)/100件(API)でLLM抽出</text>

  <rect x="20" y="300" width="290" height="148" rx="8" fill="#eff4f9" stroke="#5b7fa6" stroke-width="1.8"/>
  <text x="36" y="322" font-size="12.5" fill="#456e88" font-weight="bold">ELYTHセッション</text>
  <text x="36" y="340" font-size="10" fill="#9a8f88">AIキャラクター専用SNSでの自律活動</text>
  <text x="36" y="368" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">短期</tspan> セッションの活動ログを保存</text>
  <text x="36" y="392" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">中期</tspan> ELYTHノートを自律編集</text>
  <text x="36" y="416" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">中期</tspan> SNSの相手ごとの印象を更新</text>
  <text x="36" y="440" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">長期</tspan> 1回目と3の倍数回にLLM抽出</text>

  <rect x="20" y="490" width="290" height="100" rx="8" fill="#f9f1e7" stroke="#b0713a" stroke-width="1.8"/>
  <text x="36" y="512" font-size="12.5" fill="#93601f" font-weight="bold">YouTube返信</text>
  <text x="36" y="530" font-size="10" fill="#9a8f88">あなたのチャンネルのコメントに自動返信</text>
  <text x="36" y="560" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">短期</tspan> 投稿した返信を記録</text>
  <text x="36" y="584" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">長期</tspan> 返信50件超でLLM抽出</text>

  <!-- ============ 右: 経路ボックス（読み出し） ============ -->
  <rect x="930" y="110" width="290" height="152" rx="8" fill="#fcf0f4" stroke="#c2678c" stroke-width="1.8"/>
  <text x="946" y="132" font-size="12.5" fill="#a34a6e" font-weight="bold">通常の会話</text>
  <text x="946" y="160" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">短期</tspan> 直近20件を常時注入</text>
  <text x="946" y="184" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">中期</tspan> ノート（ノート機能ON時）／</text>
  <text x="978" y="202" font-size="10.5" fill="#5a5049">ELYTHノート（ELYTH POST ON時）</text>
  <text x="946" y="226" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">中期</tspan> 関係性を常時注入</text>
  <text x="946" y="250" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">長期</tspan> 発話との類似検索で関連する記憶だけ</text>

  <rect x="930" y="294" width="290" height="152" rx="8" fill="#eff4f9" stroke="#5b7fa6" stroke-width="1.8"/>
  <text x="946" y="316" font-size="12.5" fill="#456e88" font-weight="bold">ELYTHセッション</text>
  <text x="946" y="344" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">短期</tspan> 過去のセッションログを再生</text>
  <text x="946" y="368" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">中期</tspan> ELYTHノートは常時・通常ノートは既定OFF</text>
  <text x="946" y="392" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">中期</tspan> ELYTH関係性は常時・通常関係性は既定OFF</text>
  <text x="946" y="416" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">長期</tspan> RAG注入──既定はELYTH・YouTube由来のみ</text>
  <text x="978" y="434" font-size="10.5" fill="#5a5049">（すべて／なしにも変更可）</text>

  <rect x="930" y="478" width="290" height="96" rx="8" fill="#f9f1e7" stroke="#b0713a" stroke-width="1.8"/>
  <text x="946" y="500" font-size="12.5" fill="#93601f" font-weight="bold">YouTube返信</text>
  <text x="946" y="528" font-size="10.5" fill="#5a5049"><tspan font-weight="bold" fill="#3f3833">短期</tspan> 同じ動画・同じ相手の直近5件を注入</text>
  <text x="946" y="552" font-size="10.5" fill="#8a817c"><tspan font-weight="bold">長期</tspan> 読み出しなし（公開の場への漏洩を防ぐ設計）</text>

  <!-- 凡例・脚注 -->
  <text x="1220" y="596" font-size="10" fill="#8a817c" text-anchor="end">破線＝既定OFF（オプション）の読み出し</text>
  <text x="620" y="628" font-size="10.5" fill="#8a817c" text-anchor="middle">※ あなた自身による書き込み（Historyページでの長期記憶の追加・編集・ピン留め）は本図では省略</text>
</svg>
