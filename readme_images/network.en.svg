<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1078" viewBox="0 0 980 1078" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <title>Network</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a817c"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f9dbb"/>
    </marker>
  </defs>

  <!-- Background (painted for dark-mode safety) -->
  <rect x="0.5" y="0.5" width="979" height="1077" fill="#ffffff" stroke="#e8e2de"/>
  <g stroke="#7a6f68" stroke-width="2" fill="none">
    <circle cx="307" cy="17" r="3.5"/>
    <circle cx="299" cy="31" r="3.5"/>
    <circle cx="315" cy="31" r="3.5"/>
    <line x1="305" y1="20" x2="301" y2="28"/>
    <line x1="309" y1="20" x2="313" y2="28"/>
    <line x1="302.5" y1="31" x2="311.5" y2="31"/>
  </g>
  <text x="326" y="30" font-size="13.5" fill="#7a6f68" font-weight="bold">Network architecture ── local mode / server mode</text>
  <g transform="translate(0,32)">

  <!-- ==================== Local mode ==================== -->
  <rect x="20" y="20" width="940" height="490" rx="14" fill="#fbfaf8" stroke="#ddd6d0" stroke-width="1.5"/>
  <text x="40" y="50" font-size="16" fill="#3f3833" font-weight="bold">Local mode (default)</text>

  <!-- Cloud APIs -->
  <path d="M520 84 a13 13 0 0 1 8 -22 a16 16 0 0 1 30 -4 a13 13 0 0 1 12 26 z" fill="none" stroke="#b9c9d8" stroke-width="2"/>
  <text x="590" y="42" font-size="11.5" fill="#8b9db0">only the cloud APIs you chose (setup &amp; features)</text>
  <text x="590" y="59" font-size="10" fill="#9dabb8">setup: LLM providers / Whisper API / ElevenLabs / embeddings</text>
  <text x="590" y="76" font-size="10" fill="#9dabb8">when features ON: ELYTH / YouTube / Google Maps</text>
  <text x="590" y="93" font-size="10" fill="#9dabb8">image generation (Gemini) / DeepSearch (DuckDuckGo, page fetch)</text>

  <!-- Your PC -->
  <rect x="40" y="100" width="900" height="330" rx="12" fill="#ffffff" stroke="#b9b0aa" stroke-width="2"/>
  <text x="56" y="122" font-size="12.5" fill="#8b7f78">Your PC</text>

  <!-- Chrome (frontend) -->
  <rect x="64" y="136" width="236" height="180" rx="10" fill="#ffffff" stroke="#a99e97" stroke-width="2"/>
  <text x="78" y="158" font-size="13" fill="#3f3833" font-weight="bold">Chrome (frontend)</text>
  <text x="78" y="184" font-size="11" fill="#5a5049">Renders the Gradio UI</text>
  <text x="78" y="204" font-size="11" fill="#7a6f68">http://127.0.0.1:7860</text>
  <text x="78" y="228" font-size="11" fill="#5a5049">Plays the audio (receives via WS,</text>
  <text x="78" y="246" font-size="11" fill="#5a5049">returns playback-done ACK)</text>
  <text x="78" y="268" font-size="11" fill="#5a5049">Text input &amp; controls</text>
  <text x="78" y="288" font-size="10.5" fill="#7a6f68">AG Tab Reporter ext. → WS :5002</text>
  <text x="78" y="306" font-size="10.5" fill="#7a6f68">(sends tab titles while PC Status is ON)</text>

  <!-- Chrome<->backend -->
  <line x1="300" y1="170" x2="356" y2="170" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="360" y1="208" x2="304" y2="208" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>

  <!-- AG backend -->
  <rect x="360" y="126" width="320" height="214" rx="10" fill="#fdeef4" stroke="#dfa4bd" stroke-width="2"/>
  <text x="376" y="150" font-size="13.5" fill="#8c3a5c" font-weight="bold">AG backend (Python)</text>
  <text x="376" y="176" font-size="11" fill="#5a5049">Gradio server :7860 / WS server :8765</text>
  <text x="376" y="198" font-size="11" fill="#5a5049">Conversation engine (prompts, tool execution)</text>
  <text x="376" y="220" font-size="11" fill="#5a5049">Memory &amp; character data (character_data/)</text>
  <text x="376" y="242" font-size="11" fill="#5a5049">Mic recording (local device)</text>
  <text x="376" y="264" font-size="11" fill="#5a5049">STT: faster-whisper (in-process)</text>
  <text x="376" y="286" font-size="11" fill="#5a5049">TTS: Kokoro / Style-Bert-VITS2 (in-process)</text>
  <text x="376" y="312" font-size="10.5" fill="#9a7c8a">All outbound traffic originates here</text>

  <!-- Ollama -->
  <rect x="64" y="322" width="236" height="100" rx="10" fill="#f6f1ee" stroke="#cbc1ba" stroke-width="1.5"/>
  <text x="78" y="346" font-size="12.5" fill="#5a5049" font-weight="bold">Ollama (separate process, optional)</text>
  <text x="78" y="370" font-size="11" fill="#7a6f68">127.0.0.1:11434</text>
  <text x="78" y="392" font-size="11" fill="#7a6f68">LLM replies &amp; embedding generation</text>
  <polyline points="420,340 420,376 304,376" fill="none" stroke="#8a817c" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="366" y="368" font-size="10.5" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">HTTP</text>

  <!-- MotionPNGPlayer -->
  <rect x="706" y="136" width="220" height="182" rx="10" fill="#ffffff" stroke="#a99e97" stroke-width="2"/>
  <text x="722" y="160" font-size="13" fill="#3f3833" font-weight="bold">MotionPNGPlayer</text>
  <text x="722" y="178" font-size="10.5" fill="#9a8f88">Runs on Electron, separate from AG</text>
  <text x="722" y="204" font-size="11" fill="#5a5049">Shows the character video</text>
  <text x="722" y="222" font-size="11" fill="#7a6f68">(motion assets in a local folder)</text>
  <text x="722" y="246" font-size="11" fill="#5a5049">Receives lip-sync timing via WS</text>
  <text x="722" y="270" font-size="11" fill="#5a5049">Plays no audio (avoids doubling)</text>
  <text x="722" y="294" font-size="11" fill="#5a5049">Sends text input (input box shown)</text>
  <line x1="681" y1="192" x2="702" y2="192" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="705" y1="206" x2="684" y2="206" stroke="#8a817c" stroke-width="2" marker-end="url(#ah)"/>
  <text x="693" y="182" font-size="10" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">WS</text>

  <!-- Blocked caption -->
  <g stroke="#c0392b" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="462" x2="62" y2="474"/>
    <line x1="62" y1="462" x2="50" y2="474"/>
  </g>
  <text x="74" y="473" font-size="12.5" fill="#5a5049">Unreachable from other devices ─ everything listens on 127.0.0.1 (not exposed to the LAN)</text>

  <!-- ==================== Server mode ==================== -->
  <rect x="20" y="530" width="940" height="494" rx="14" fill="#fbfaf8" stroke="#ddd6d0" stroke-width="1.5"/>
  <text x="40" y="560" font-size="16" fill="#3f3833" font-weight="bold">Server mode</text>

  <!-- Cloud APIs -->
  <path d="M176 620 a13 13 0 0 1 8 -22 a16 16 0 0 1 30 -4 a13 13 0 0 1 12 26 z" fill="none" stroke="#b9c9d8" stroke-width="2"/>
  <text x="240" y="596" font-size="11.5" fill="#8b9db0">only the cloud APIs you chose (setup &amp; features)</text>
  <text x="240" y="614" font-size="10.5" fill="#9dabb8">connections originate from the AG backend ─ same as local mode</text>

  <!-- Tailscale zone -->
  <rect x="40" y="634" width="900" height="326" rx="12" fill="#edf3f8" stroke="#b9cbdb" stroke-width="1.5"/>
  <text x="896" y="662" font-size="13.5" fill="#55708a" text-anchor="end" font-weight="bold">Tailscale private network</text>
  <path d="M912 644 l10 4 v8 q0 8 -10 12 q-10 -4 -10 -12 v-8 z" fill="none" stroke="#55708a" stroke-width="2"/>

  <!-- AG server -->
  <rect x="64" y="684" width="496" height="260" rx="10" fill="#ffffff" stroke="#9fb4c6" stroke-width="2"/>
  <text x="312" y="708" font-size="14" fill="#3f3833" text-anchor="middle" font-weight="bold">Your PC (the AG server)</text>

  <rect x="84" y="722" width="232" height="204" rx="8" fill="#fdeef4" stroke="#dfa4bd" stroke-width="1.5"/>
  <text x="98" y="744" font-size="12.5" fill="#8c3a5c" font-weight="bold">AG backend</text>
  <text x="98" y="768" font-size="10.5" fill="#5a5049">Conversation engine, memory, STT/TTS</text>
  <text x="98" y="786" font-size="10.5" fill="#7a6f68">(processing identical to local mode)</text>
  <text x="98" y="812" font-size="10.5" fill="#5a5049">Cloud API and Ollama connections</text>
  <text x="98" y="830" font-size="10.5" fill="#5a5049">still originate here (↑ to the cloud above)</text>

  <rect x="336" y="722" width="204" height="204" rx="8" fill="#f4f8fb" stroke="#9fb4c6" stroke-width="1.5"/>
  <text x="350" y="744" font-size="12" fill="#3f3833" font-weight="bold">Web server (uvicorn+FastAPI)</text>
  <text x="350" y="768" font-size="10.5" fill="#5a5049">Tailscale IP:7860, HTTPS</text>
  <text x="350" y="786" font-size="10.5" fill="#7a6f68">(certificate fetched automatically)</text>
  <text x="350" y="810" font-size="10.5" fill="#5a5049">Screens served:</text>
  <text x="360" y="828" font-size="10.5" fill="#5a5049">/　desktop UI</text>
  <text x="360" y="846" font-size="10.5" fill="#5a5049">/mobile　mobile UI</text>
  <text x="360" y="864" font-size="10.5" fill="#5a5049">/admin　admin console</text>
  <text x="360" y="888" font-size="10.5" fill="#5a5049">/ws　WebSocket</text>
  <text x="370" y="906" font-size="10.5" fill="#7a6f68">(audio, lip-sync, UI updates)</text>

  <line x1="318" y1="800" x2="334" y2="800" stroke="#8a817c" stroke-width="2.5"/>

  <!-- Client device (phone) -->
  <rect x="600" y="684" width="320" height="116" rx="10" fill="#ffffff" stroke="#9fb4c6" stroke-width="1.5"/>
  <text x="616" y="706" font-size="12.5" fill="#3f3833" font-weight="bold">Client device (phone, tablet)</text>
  <rect x="616" y="718" width="288" height="70" rx="7" fill="#f4f8fb" stroke="#c6d5e2" stroke-width="1.5"/>
  <text x="630" y="738" font-size="11.5" fill="#3f3833" font-weight="bold">Browser ─ mobile UI</text>
  <text x="630" y="760" font-size="10.5" fill="#5a5049">up: text, mic audio, camera images</text>
  <text x="630" y="778" font-size="10.5" fill="#5a5049">down: replies, synthesized audio, lip-sync, UI updates</text>

  <!-- Client device (PC) -->
  <rect x="600" y="820" width="320" height="124" rx="10" fill="#ffffff" stroke="#9fb4c6" stroke-width="1.5"/>
  <text x="616" y="842" font-size="12.5" fill="#3f3833" font-weight="bold">Client device (a PC while out, etc.)</text>
  <text x="616" y="868" font-size="10.5" fill="#5a5049">Browser ─ desktop UI / admin console</text>
  <text x="616" y="890" font-size="10.5" fill="#5a5049">AG Client Addon ─ resident, hotkey calls</text>
  <text x="616" y="912" font-size="10.5" fill="#5a5049">MotionPNGPlayer ─ receives audio/lip-sync data only</text>

  <!-- Connections -->
  <line x1="544" y1="760" x2="596" y2="742" stroke="#7f9dbb" stroke-width="2" marker-start="url(#ahb)" marker-end="url(#ahb)"/>
  <line x1="544" y1="850" x2="596" y2="866" stroke="#7f9dbb" stroke-width="2" marker-start="url(#ahb)" marker-end="url(#ahb)"/>
  <text x="568" y="812" font-size="10.5" fill="#55708a" text-anchor="middle" paint-order="stroke" stroke="#edf3f8" stroke-width="5" stroke-linejoin="round">HTTPS + WSS /ws</text>

  <!-- Blocked / auth caption -->
  <g stroke="#c0392b" stroke-width="3" stroke-linecap="round">
    <line x1="316" y1="978" x2="328" y2="990"/>
    <line x1="328" y1="978" x2="316" y2="990"/>
  </g>
  <text x="340" y="989" font-size="12.5" fill="#5a5049">Unreachable from the internet ─ no ports opened</text>
  <text x="340" y="1012" font-size="11.5" fill="#8b7f78">No extra login layer ─ access control is tailnet membership management</text>
  <line x1="545" y1="126" x2="545" y2="90" stroke="#8a817c" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="200" y1="722" x2="200" y2="626" stroke="#8a817c" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="328" y="158" font-size="10.5" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">HTTP (UI actions)</text>
  <text x="330" y="226" font-size="10.5" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">WS 8765</text>
  <text x="330" y="242" font-size="10.5" fill="#8b7f78" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">audio + lip-sync</text>
  <text x="557" y="112" font-size="10.5" fill="#8b7f78" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">HTTPS</text>
  <text x="212" y="688" font-size="10.5" fill="#8b7f78" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">HTTPS</text>
  </g>
</svg>
